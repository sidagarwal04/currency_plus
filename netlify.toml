[build]
  command = "cp -n lib/config/api_config.example.dart lib/config/api_config.dart && flutter build web --dart-define=API_KEY=${API_KEY}"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "3.38.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
